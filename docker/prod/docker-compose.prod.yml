services:
  db:
    image: postgres:15-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pchat_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/prod/dockerfile.prod
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-0}
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/src
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pchat_prod}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      RAILWAY_PUBLIC_DOMAIN: ${RAILWAY_PUBLIC_DOMAIN:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      PORT: ${PORT:-8000}
    command: sh -c "uv run python manage.py migrate --noinput && uv run python manage.py runserver 0.0.0.0:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
