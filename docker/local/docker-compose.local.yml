services:
  db:
    image: postgres:15-alpine
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pchat_local}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: localhost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: be-dev
      dockerfile: docker/local/dockerfile.local
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./manage.py:/app/manage.py
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - /app/__pycache__
      - /app/.venv-docker
    env_file:
      - path: .env
        required: true
    environment:
      DEBUG: ${DEBUG:-1}
      DJANGO_SETTINGS_MODULE: settings.local
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pchat_local}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key}
    command: uv run python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: fe-dev
      dockerfile: docker/local/dockerfile.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: pnpm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
